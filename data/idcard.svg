<svg xmlns="http://www.w3.org/2000/svg" width="480" height="260" viewBox="0 0 480 260" font-family="'SF Mono','Fira Code',Consolas,Menlo,monospace" font-size="13">
  <defs>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardClip"><rect width="480" height="260" rx="12"/></clipPath>
  </defs>
  <rect width="480" height="260" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <rect x="0" y="0" width="480" height="3" rx="1.5" fill="#3fb950"/>
  <rect x="24" y="28" width="80" height="100" rx="6" fill="#8b949e" opacity="0.2"/>
  <text x="64" y="83" font-size="10" fill="#8b949e" text-anchor="middle">PHOTO</text>
  <text x="120" y="50" font-size="16" font-weight="bold" fill="#c9d1d9">Nandan Amin</text>
  <text x="120" y="70" fill="#3fb950">Cybersecurity Developer</text>
  <text x="120" y="90" fill="#8b949e">Nandanverse</text>
  <text x="24" y="150" fill="#8b949e">ID:</text>
  <text x="120" y="150" fill="#c9d1d9">ND-2026-SEC-001</text>
  <text x="24" y="174" fill="#8b949e">Location:</text>
  <text x="120" y="174" fill="#c9d1d9">India</text>
  <text x="24" y="198" fill="#8b949e">Clearance:</text>
  <text x="120" y="198" fill="#c9d1d9">Level 3</text>
  <line x1="24" y1="228" x2="456" y2="228" stroke="#30363d" stroke-width="1"/>
  <text x="24" y="248" font-size="10" fill="#8b949e">DEVELOPER IDENTITY CARD</text>
  <text x="456" y="248" font-size="10" fill="#8b949e" text-anchor="end">2026</text>
  <g clip-path="url(#cardClip)">
    <rect x="-200" y="0" width="200" height="260" fill="url(#shimmer)">
      <animate attributeName="x" from="-200" to="480" dur="3s" begin="0.5s" fill="freeze"/>
    </rect>
  </g>
</svg>